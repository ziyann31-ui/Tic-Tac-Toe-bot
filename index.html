<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tic Tac Toe</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0a0f;--surface:#13131a;--border:#1e1e2e;--accent:#7c3aed;--accent2:#06b6d4;--x:#f472b6;--o:#34d399;--text:#e2e8f0;--muted:#64748b;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Space Mono',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(124,58,237,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(124,58,237,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;}
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap');
.wait{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;}
.wait-icon{font-size:60px;animation:float 3s ease-in-out infinite;}
.wait-title{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.wait-sub{font-size:12px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.wait-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;width:100%;}
.wait-card-title{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;}
.wait-player{display:flex;align-items:center;gap:12px;padding:10px 0;}
.wait-player+.wait-player{border-top:1px solid var(--border);}
.wsym{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:18px;font-weight:800;}
.wsym.x{background:rgba(244,114,182,.1);color:var(--x);}
.wsym.o{background:rgba(52,211,153,.1);color:var(--o);}
.wname{font-size:13px;font-weight:700;}
.wname.m{color:var(--muted);}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--accent2);margin-left:auto;animation:pulse 1.5s ease-in-out infinite;}
.spin-row{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;letter-spacing:1px;text-transform:uppercase;}
.spin{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
.game{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:14px;}
.hdr{text-align:center;}
.ttl{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.rnd-info{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:4px;}
.rbar{display:flex;gap:8px;align-items:center;}
.rdot{width:10px;height:10px;border-radius:50%;border:1px solid var(--border);transition:all .3s;}
.rdot.x{background:var(--x);border-color:var(--x);box-shadow:0 0 8px var(--x);}
.rdot.o{background:var(--o);border-color:var(--o);box-shadow:0 0 8px var(--o);}
.rsep{font-size:10px;color:var(--muted);}
.players{display:flex;align-items:center;gap:12px;width:100%;}
.pl{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;transition:all .3s;position:relative;overflow:hidden;}
.pl.act{border-color:var(--accent);box-shadow:0 0 20px rgba(124,58,237,.2);}
.pl.act::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.pl-sym{font-size:22px;font-weight:700;font-family:'Syne',sans-serif;}
.plx .pl-sym{color:var(--x);}
.plo .pl-sym{color:var(--o);}
.pl-name{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pl-score{font-size:18px;font-weight:700;margin-top:4px;}
.vs{font-size:11px;color:var(--muted);font-weight:700;}
.status{font-size:13px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;height:20px;text-align:center;}
.status.my{color:var(--accent2);}
.status.win{color:var(--o);}
.status.lose{color:var(--x);}
.bwrap{position:relative;}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:20px;}
.cell{width:88px;height:88px;background:var(--bg);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;font-family:'Syne',sans-serif;font-size:36px;font-weight:800;user-select:none;}
.cell:hover:not(.taken):not(.off){border-color:var(--accent);background:rgba(124,58,237,.05);transform:scale(1.02);}
.cell.x{color:var(--x);}
.cell.o{color:var(--o);}
.cell.wc{border-color:var(--accent);background:rgba(124,58,237,.1);box-shadow:0 0 15px rgba(124,58,237,.4);}
.cell.off{cursor:not-allowed;opacity:.7;}
.overlay{display:none;position:absolute;inset:0;background:rgba(10,10,15,.92);border-radius:20px;align-items:center;justify-content:center;flex-direction:column;gap:8px;backdrop-filter:blur(6px);}
.overlay.show{display:flex;}
.ov-em{font-size:48px;}
.ov-txt{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;text-align:center;}
.ov-sub{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
.btns{display:flex;gap:10px;width:100%;}
.btn{flex:1;padding:13px;border-radius:12px;border:none;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;}
.btn-q{background:var(--surface);color:var(--muted);border:1px solid var(--border);}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="wait" id="W">
  <div class="wait-icon">⚔️</div>
  <div>
    <div class="wait-title">Tic Tac Toe</div>
    <div class="wait-sub" id="wsub">Waiting for opponent...</div>
  </div>
  <div class="wait-card">
    <div class="wait-card-title">Players</div>
    <div class="wait-player">
      <div class="wsym x">X</div>
      <div class="wname" id="wnx">Player X</div>
      <div class="pdot" style="background:var(--o)"></div>
    </div>
    <div class="wait-player">
      <div class="wsym o">O</div>
      <div class="wname m" id="wno">Waiting...</div>
      <div class="pdot"></div>
    </div>
  </div>
  <div class="spin-row" id="srow">
    <div class="spin"></div>
    <span>Waiting for opponent to join</span>
  </div>
</div>

<div class="game" id="G" style="display:none">
  <div class="hdr">
    <div class="ttl">Tic Tac Toe</div>
    <div class="rnd-info" id="rinfo">Round 1 of 3</div>
  </div>
  <div class="rbar">
    <div class="rdot" id="d0"></div>
    <div class="rsep">·</div>
    <div class="rdot" id="d1"></div>
    <div class="rsep">·</div>
    <div class="rdot" id="d2"></div>
  </div>
  <div class="players">
    <div class="pl plx" id="PX">
      <div class="pl-sym">X</div>
      <div class="pl-name" id="nx">Player X</div>
      <div class="pl-score" id="sx">0</div>
    </div>
    <div class="vs">VS</div>
    <div class="pl plo" id="PO">
      <div class="pl-sym">O</div>
      <div class="pl-name" id="no">Player O</div>
      <div class="pl-score" id="so">0</div>
    </div>
  </div>
  <div class="status" id="st">Loading...</div>
  <div class="bwrap">
    <div class="board" id="B">
      <div class="cell" onclick="mv(0)"></div>
      <div class="cell" onclick="mv(1)"></div>
      <div class="cell" onclick="mv(2)"></div>
      <div class="cell" onclick="mv(3)"></div>
      <div class="cell" onclick="mv(4)"></div>
      <div class="cell" onclick="mv(5)"></div>
      <div class="cell" onclick="mv(6)"></div>
      <div class="cell" onclick="mv(7)"></div>
      <div class="cell" onclick="mv(8)"></div>
    </div>
    <div class="overlay" id="OV">
      <div class="ov-em" id="oem">🏆</div>
      <div class="ov-txt" id="otxt">You Win!</div>
      <div class="ov-sub" id="osub">Well played</div>
    </div>
  </div>
  <div class="btns">
    <button class="btn btn-q" onclick="quit()">Quit</button>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}

const API = 'https://web-production-a0396.up.railway.app';
const sp  = tg?.initDataUnsafe?.start_param || '';
let gid, pid, mySym='X';

if(sp && sp.includes('_')){
  const p = sp.split('_');
  gid = p[0];
  pid = String(tg?.initDataUnsafe?.user?.id || '0');
} else {
  const p = new URLSearchParams(window.location.search);
  gid = window._GAME_ID || p.get('game_id');
  pid = window._PLAYER_ID || p.get('player_id') || String(tg?.initDataUnsafe?.user?.id||'0');
}

const WL = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

let board=Array(9).fill(null), cur='X', rounds={X:0,O:0}, round=1;
let over=false, busy=false, names={X:'Player X',O:'Player O'};
let ptimer=null, wtimer=null;

// INIT
async function init(){
  if(!gid||!pid||pid==='0'){wp();return;}
  try{
    const nm = encodeURIComponent(tg?.initDataUnsafe?.user?.first_name||'Player');
    const r  = await fetch(`${API}/join?game_id=${gid}&pid=${pid}&name=${nm}`);
    const d  = await r.json();
    if(d.error==='start_required'){
      document.getElementById('wsub').innerHTML='Please <a href="https://t.me/XO_VerseBot?start=1" style="color:var(--accent2)">start @XO_VerseBot</a> first!';
      document.getElementById('srow').style.display='none';
      return;
    }
    if(d.error==='expired'){
      document.getElementById('wsub').textContent='Game expired.';
      document.getElementById('srow').style.display='none';
      return;
    }
    if(d.ok){
      mySym = d.symbol;
      if(d.rounds) rounds=d.rounds;
      if(d.status==='playing'){
        const sr=await fetch(`${API}/state?game_id=${gid}&pid=${pid}`);
        const sd=await sr.json();
        applyS(sd);
        showGame();
      } else wp();
    }
  } catch(e){console.error(e);wp();}
}
init();

// APPLY STATE
function applyS(d){
  if(!d||d.error) return;
  if(d.board)   board=d.board;
  if(d.current) cur=d.current;
  if(d.rounds)  rounds=d.rounds;
  if(d.round)   round=d.round;
  if(d.my_symbol) mySym=d.my_symbol;
  if(d.players){
    names.X=d.players.X?.name||'Player X';
    names.O=d.players.O?.name||'Player O';
  }
}

// SHOW GAME
function showGame(){
  document.getElementById('W').style.display='none';
  document.getElementById('G').style.display='flex';
  document.getElementById('nx').textContent=names.X;
  document.getElementById('no').textContent=names.O;
  draw();
  if(cur!==mySym) pp();
}

// MOVE
async function mv(i){
  if(over||busy||board[i]!==null||cur!==mySym) return;
  busy=true;
  board[i]=mySym;
  drawBoard();
  offBoard();
  try{
    const r=await fetch(`${API}/move`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({game_id:gid,player_id:pid,cell:i})
    });
    const d=await r.json();
    if(d.error){
      board[i]=null; busy=false; draw(); return;
    }
    board=d.board; cur=d.current;
    if(d.rounds) rounds=d.rounds;
    if(d.round)  round=d.round;
    busy=false;
    if(d.round_winner){
      rndEnd(d.round_winner, d.game_winner);
    } else {
      draw();
      pp(); // poll for opponent
    }
  } catch(e){
    console.error(e); board[i]=null; busy=false; draw();
  }
}

// ROUND END
function rndEnd(rw, gw){
  document.getElementById('sx').textContent=rounds.X;
  document.getElementById('so').textContent=rounds.O;
  drawDots();
  if(gw){
    over=true; drawBoard();
    if(gw===mySym) showOv('🏆','You Win the Game!','Champion! 🎉');
    else           showOv('😔','You Lose','Better luck next time');
    return;
  }
  // Round over — show briefly then next
  if(rw==='draw')      showOv('🤝','Round Draw!',`Round ${round} of 3`);
  else if(rw===mySym)  showOv('✅','Round Won!',`Round ${round} of 3`);
  else                 showOv('❌','Round Lost!',`Round ${round} of 3`);

  setTimeout(()=>{
    hideOv();
    draw();
    if(cur===mySym){ onBoard(); }
    else { pp(); }
  }, 2000);
}

// POLLING
function pp(){
  clearTimeout(ptimer);
  ptimer = setTimeout(doPoll, 1500);
}

async function doPoll(){
  if(over) return;
  try{
    const r=await fetch(`${API}/state?game_id=${gid}&pid=${pid}`);
    const d=await r.json();
    if(!d||d.error){ pp(); return; }

    // Opponent quit
    if(d.quit_by && String(d.quit_by)!==String(pid)){
      over=true; drawBoard();
      showOv('🏆','Opponent Quit!','You Win!');
      return;
    }

    // Game finished
    if(d.status==='finished' && d.game_winner && !over){
      applyS(d); over=true; drawBoard();
      if(d.game_winner===mySym) showOv('🏆','You Win!','Champion!');
      else                      showOv('😔','You Lose','Better luck next time');
      return;
    }

    // Round winner
    if(d.round_winner){
      applyS(d);
      rndEnd(d.round_winner, d.game_winner);
      return;
    }

    // Normal update
    const bc = JSON.stringify(d.board)!==JSON.stringify(board);
    const tc = d.current!==cur;
    if(bc||tc){ applyS(d); draw(); }

    if(cur!==mySym && !over) pp();
    else if(cur===mySym && !busy){ busy=false; onBoard(); }
  } catch(e){ console.error(e); pp(); }
}

// WAIT POLL
function wp(){
  clearTimeout(wtimer);
  wtimer = setTimeout(doWP, 1500);
}
async function doWP(){
  try{
    const r=await fetch(`${API}/state?game_id=${gid}&pid=${pid}`);
    const d=await r.json();
    if(d.status==='expired'){
      document.getElementById('wsub').textContent='Game expired. No one joined.';
      document.getElementById('srow').style.display='none';
      return;
    }
    if(d.players){
      document.getElementById('wnx').textContent=d.players.X?.name||'Player X';
      document.getElementById('wno').textContent=d.players.O?.name||'Waiting...';
    }
    if(d.status==='playing'&&d.players?.X&&d.players?.O){
      applyS(d); showGame(); return;
    }
    wp();
  } catch(e){ console.error(e); wp(); }
}

// RENDER
function draw(){ drawBoard(); drawStatus(); drawDots(); drawScores(); }

function drawBoard(){
  document.querySelectorAll('.cell').forEach((c,i)=>{
    const v=board[i];
    c.textContent=v||'';
    c.className='cell'+(v?' '+v.toLowerCase()+' taken':'');
    if(over||cur!==mySym||busy) c.classList.add('off');
  });
}

function drawStatus(){
  const mt=cur===mySym&&!over;
  const s=document.getElementById('st');
  s.textContent=mt?'Your Turn':"Opponent's Turn";
  s.className='status'+(mt?' my':'');
  document.getElementById('PX').classList.toggle('act',cur==='X');
  document.getElementById('PO').classList.toggle('act',cur==='O');
}

function drawDots(){
  const ds=['d0','d1','d2'].map(id=>document.getElementById(id));
  ds.forEach(d=>d.className='rdot');
  let i=0;
  for(let x=0;x<rounds.X;x++) if(ds[i]){ds[i].className='rdot x';i++;}
  for(let o=0;o<rounds.O;o++) if(ds[i]){ds[i].className='rdot o';i++;}
  document.getElementById('rinfo').textContent=`Round ${round} of 3`;
}

function drawScores(){
  document.getElementById('sx').textContent=rounds.X;
  document.getElementById('so').textContent=rounds.O;
}

function onBoard(){ document.querySelectorAll('.cell').forEach(c=>c.classList.remove('off')); drawStatus(); }
function offBoard(){ document.querySelectorAll('.cell').forEach(c=>c.classList.add('off')); }

function showOv(em,txt,sub){
  document.getElementById('oem').textContent=em;
  document.getElementById('otxt').textContent=txt;
  document.getElementById('osub').textContent=sub;
  document.getElementById('OV').classList.add('show');
}
function hideOv(){ document.getElementById('OV').classList.remove('show'); }

async function quit(){
  if(API&&gid&&pid) try{await fetch(`${API}/quit?game_id=${gid}&pid=${pid}`);}catch(e){}
  if(tg) tg.close(); else location.reload();
}
</script>
</body>
</html>
