<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tic Tac Toe</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap');
  :root {
    --bg:#0a0a0f;--surface:#13131a;--border:#1e1e2e;
    --accent:#7c3aed;--accent2:#06b6d4;
    --x:#f472b6;--o:#34d399;--text:#e2e8f0;--muted:#64748b;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--text);font-family:'Space Mono',monospace;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:20px;overflow:hidden;}
  body::before{content:'';position:fixed;inset:0;
    background-image:linear-gradient(rgba(124,58,237,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(124,58,237,.03) 1px,transparent 1px);
    background-size:40px 40px;pointer-events:none;}

  /* WAITING SCREEN */
  .waiting-screen{width:100%;max-width:340px;display:flex;flex-direction:column;
    align-items:center;gap:24px;text-align:center;animation:fadeUp .5s ease;}
  .wait-icon{font-size:64px;animation:float 3s ease-in-out infinite;}
  .wait-title{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .wait-sub{font-size:12px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
  .wait-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:20px;width:100%;}
  .wait-card-title{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;}
  .wait-player{display:flex;align-items:center;gap:12px;padding:10px 0;}
  .wait-player+.wait-player{border-top:1px solid var(--border);}
  .wait-sym{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;
    justify-content:center;font-family:'Syne',sans-serif;font-size:18px;font-weight:800;}
  .wait-sym.x{background:rgba(244,114,182,.1);color:var(--x);}
  .wait-sym.o{background:rgba(52,211,153,.1);color:var(--o);}
  .wait-name{font-size:13px;font-weight:700;}
  .wait-name.muted{color:var(--muted);}
  .pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);
    margin-left:auto;animation:pulse 1.5s ease-in-out infinite;}
  .spinner-row{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;
    letter-spacing:1px;text-transform:uppercase;}
  .spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;animation:spin .8s linear infinite;}

  /* GAME SCREEN */
  .game-screen{width:100%;max-width:360px;display:flex;flex-direction:column;
    align-items:center;gap:20px;}
  .header{text-align:center;animation:fadeDown .5s ease;}
  .title{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .subtitle{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:4px;}
  .players{display:flex;align-items:center;gap:12px;width:100%;animation:fadeUp .5s ease .1s both;}
  .player{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:12px;text-align:center;transition:all .3s;position:relative;overflow:hidden;}
  .player.active{border-color:var(--accent);box-shadow:0 0 20px rgba(124,58,237,.2);}
  .player.active::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));}
  .player-sym{font-size:22px;font-weight:700;font-family:'Syne',sans-serif;}
  .player-x .player-sym{color:var(--x);}
  .player-o .player-sym{color:var(--o);}
  .player-name{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:1px;
    text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .player-score{font-size:18px;font-weight:700;margin-top:4px;}
  .vs{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px;}
  .status{font-size:13px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;
    height:20px;text-align:center;animation:fadeUp .5s ease .2s both;}
  .status.your-turn{color:var(--accent2);}
  .status.win{color:var(--o);}
  .status.lose{color:var(--x);}
  .status.draw{color:var(--accent);}
  .board-wrap{position:relative;animation:scaleIn .4s ease .3s both;}
  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px;
    background:var(--surface);border:1px solid var(--border);border-radius:20px;}
  .cell{width:88px;height:88px;background:var(--bg);border:1px solid var(--border);
    border-radius:12px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:all .2s;font-family:'Syne',sans-serif;font-size:36px;
    font-weight:800;user-select:none;}
  .cell:hover:not(.taken):not(.disabled){border-color:var(--accent);
    background:rgba(124,58,237,.05);transform:scale(1.02);}
  .cell:active:not(.taken):not(.disabled){transform:scale(.97);}
  .cell.x{color:var(--x);animation:popIn .2s ease;}
  .cell.o{color:var(--o);animation:popIn .2s ease;}
  .cell.win-cell{border-color:var(--accent);background:rgba(124,58,237,.1);
    box-shadow:0 0 15px rgba(124,58,237,.4);animation:winPulse .6s ease;}
  .cell.disabled{cursor:not-allowed;opacity:.7;}
  .result-overlay{display:none;position:absolute;inset:0;background:rgba(10,10,15,.9);
    border-radius:20px;align-items:center;justify-content:center;flex-direction:column;
    gap:8px;backdrop-filter:blur(6px);}
  .result-overlay.show{display:flex;animation:fadeIn .4s ease;}
  .result-emoji{font-size:48px;animation:bounceIn .5s ease;}
  .result-text{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;text-align:center;}
  .result-sub{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
  .btn-row{display:flex;gap:10px;width:100%;animation:fadeUp .5s ease .4s both;}
  .btn{flex:1;padding:14px;border-radius:12px;border:none;font-family:'Space Mono',monospace;
    font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s;}
  .btn-primary{background:linear-gradient(135deg,var(--accent),#5b21b6);color:white;
    box-shadow:0 4px 15px rgba(124,58,237,.3);}
  .btn-primary:hover{transform:translateY(-1px);}
  .btn-secondary{background:var(--surface);color:var(--muted);border:1px solid var(--border);}
  .btn-secondary:hover{border-color:var(--accent);color:var(--text);}

  @keyframes fadeDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
  @keyframes popIn{0%{transform:scale(0) rotate(-10deg)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
  @keyframes winPulse{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
  @keyframes bounceIn{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
</style>
</head>
<body>

<!-- WAITING SCREEN -->
<div class="waiting-screen" id="waitingScreen">
  <div class="wait-icon">⚔️</div>
  <div>
    <div class="wait-title">Tic Tac Toe</div>
    <div class="wait-sub" style="margin-top:6px">Waiting for opponent...</div>
  </div>
  <div class="wait-card">
    <div class="wait-card-title">Players</div>
    <div class="wait-player">
      <div class="wait-sym x" id="wsymX">X</div>
      <div class="wait-name" id="wnameX">Player X</div>
      <div class="pulse-dot" style="background:var(--o)"></div>
    </div>
    <div class="wait-player">
      <div class="wait-sym o" id="wsymO">O</div>
      <div class="wait-name muted" id="wnameO">Waiting...</div>
      <div class="pulse-dot"></div>
    </div>
  </div>
  <div class="spinner-row">
    <div class="spinner"></div>
    <span>Waiting for opponent to join</span>
  </div>
</div>

<!-- GAME SCREEN -->
<div class="game-screen" id="gameScreen" style="display:none">
  <div class="header">
    <div class="title">Tic Tac Toe</div>
    <div class="subtitle">May the best player win</div>
  </div>
  <div class="players">
    <div class="player player-x active" id="playerX">
      <div class="player-sym">X</div>
      <div class="player-name" id="nameX">Player X</div>
      <div class="player-score" id="scoreX">0</div>
    </div>
    <div class="vs">VS</div>
    <div class="player player-o" id="playerO">
      <div class="player-sym">O</div>
      <div class="player-name" id="nameO">Player O</div>
      <div class="player-score" id="scoreO">0</div>
    </div>
  </div>
  <div class="status your-turn" id="status">Your Turn</div>
  <div class="board-wrap">
    <div class="board" id="board">
      <div class="cell" data-i="0" onclick="move(0)"></div>
      <div class="cell" data-i="1" onclick="move(1)"></div>
      <div class="cell" data-i="2" onclick="move(2)"></div>
      <div class="cell" data-i="3" onclick="move(3)"></div>
      <div class="cell" data-i="4" onclick="move(4)"></div>
      <div class="cell" data-i="5" onclick="move(5)"></div>
      <div class="cell" data-i="6" onclick="move(6)"></div>
      <div class="cell" data-i="7" onclick="move(7)"></div>
      <div class="cell" data-i="8" onclick="move(8)"></div>
    </div>
    <div class="result-overlay" id="resultOverlay">
      <div class="result-emoji" id="resultEmoji">🏆</div>
      <div class="result-text" id="resultText">You Win!</div>
      <div class="result-sub" id="resultSub">Well played</div>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-secondary" onclick="quitGame()">Quit</button>
    <button class="btn btn-primary" id="newRoundBtn" style="display:none" onclick="newRound()">Next Round</button>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}

// Use server-injected globals if available, fallback to URL params
const params   = new URLSearchParams(window.location.search);
const gameId   = window._GAME_ID   || params.get('game_id');
const playerId = window._PLAYER_ID || params.get('player_id');
const symbol   = window._SYMBOL    || params.get('symbol')||'X';
const nameX    = window._NAME_X    || decodeURIComponent(params.get('name_x')||'Player X');
const nameO    = window._NAME_O    || decodeURIComponent(params.get('name_o')||'Waiting...');
const apiUrl   = window._API_URL   || params.get('api')||'';

const WIN_LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

let state={
  board:Array(9).fill(null),current:'X',mySymbol:symbol,
  scores:{X:0,O:0},gameOver:false,names:{X:nameX,O:nameO}
};

// Init waiting screen
document.getElementById('wnameX').textContent = nameX;
document.getElementById('wnameO').textContent = nameO;

// If both players present — go to game directly
if(nameO !== 'Waiting...'){
  startGame();
} else {
  // Poll for opponent
  pollWaiting();
}

function startGame(){
  document.getElementById('waitingScreen').style.display='none';
  document.getElementById('gameScreen').style.display='flex';
  document.getElementById('nameX').textContent = state.names.X;
  document.getElementById('nameO').textContent = state.names.O;
  updateTurnUI();
  if(symbol==='O') pollState();
}

function move(i){
  if(state.gameOver||state.board[i]||state.current!==state.mySymbol) return;
  state.board[i]=state.mySymbol;
  renderBoard();
  if(apiUrl&&gameId){
    fetch(`${apiUrl}/move`,{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({game_id:gameId,player_id:playerId,cell:i})
    }).catch(console.error);
  }
  const res=checkResult();
  if(res){handleResult(res);}
  else{state.current=state.current==='X'?'O':'X';updateTurnUI();pollState();}
}

function checkResult(){
  for(const[a,b,c]of WIN_LINES){
    if(state.board[a]&&state.board[a]===state.board[b]&&state.board[a]===state.board[c])
      return{winner:state.board[a],line:[a,b,c]};
  }
  if(state.board.every(Boolean))return{winner:null};
  return null;
}

function handleResult(res){
  state.gameOver=true;
  if(res.winner){
    res.line.forEach(i=>document.querySelectorAll('.cell')[i].classList.add('win-cell'));
    state.scores[res.winner]++;
    document.getElementById('scoreX').textContent=state.scores.X;
    document.getElementById('scoreO').textContent=state.scores.O;
    if(res.winner===state.mySymbol) showResult('🏆','You Win!','Excellent play!','win');
    else showResult('😔','You Lose','Better luck next time','lose');
  } else {
    showResult('🤝',"It's a Draw!",'Great minds think alike','draw');
  }
  document.getElementById('newRoundBtn').style.display='block';
  if(apiUrl&&gameId){
    fetch(`${apiUrl}/result`,{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({game_id:gameId,winner:res.winner,scores:state.scores})
    }).catch(console.error);
  }
}

function showResult(emoji,text,sub,type){
  document.getElementById('resultEmoji').textContent=emoji;
  document.getElementById('resultText').textContent=text;
  document.getElementById('resultSub').textContent=sub;
  document.getElementById('resultOverlay').classList.add('show');
  document.getElementById('status').textContent=text;
  document.getElementById('status').className=`status ${type}`;
}

function newRound(){
  state.board=Array(9).fill(null);state.gameOver=false;state.current='X';
  document.getElementById('resultOverlay').classList.remove('show');
  document.getElementById('newRoundBtn').style.display='none';
  document.querySelectorAll('.cell').forEach(c=>{c.className='cell';c.textContent='';});
  updateTurnUI();
  if(state.mySymbol==='O') pollState();
}

function renderBoard(){
  document.querySelectorAll('.cell').forEach((cell,i)=>{
    const val=state.board[i];
    cell.textContent=val||'';
    cell.className=`cell${val?' '+val.toLowerCase()+' taken':''}`;
    if(state.gameOver||state.current!==state.mySymbol) cell.classList.add('disabled');
  });
}

function updateTurnUI(){
  const myTurn=state.current===state.mySymbol&&!state.gameOver;
  document.getElementById('status').textContent=myTurn?'Your Turn':"Opponent's Turn";
  document.getElementById('status').className=`status ${myTurn?'your-turn':'waiting'}`;
  document.getElementById('playerX').classList.toggle('active',state.current==='X');
  document.getElementById('playerO').classList.toggle('active',state.current==='O');
  renderBoard();
}

// Poll waiting screen for opponent
let waitPollTimer=null;
function pollWaiting(){
  if(!apiUrl||!gameId) return;
  clearTimeout(waitPollTimer);
  waitPollTimer=setTimeout(async()=>{
    try{
      const r=await fetch(`${apiUrl}/state?game_id=${gameId}`);
      const data=await r.json();
      if(data.status==='playing'){
        // Opponent joined! Update name and start game
        const oName = data.players?.[symbol==='X'?'O':'X']?.name||'Opponent';
        if(symbol==='X') state.names.O=oName;
        else state.names.X=oName;
        startGame();
      } else { pollWaiting(); }
    } catch{ pollWaiting(); }
  },2000);
}

// Poll for opponent's move
let pollTimer=null;
function pollState(){
  if(!apiUrl||!gameId) return;
  clearTimeout(pollTimer);
  pollTimer=setTimeout(async()=>{
    try{
      const r=await fetch(`${apiUrl}/state?game_id=${gameId}`);
      const data=await r.json();
      if(data.board){
        state.board=data.board;state.current=data.current;
        renderBoard();
        const res=checkResult();
        if(res){handleResult(res);return;}
        updateTurnUI();
        if(state.current!==state.mySymbol) pollState();
      } else pollState();
    } catch{ pollState(); }
  },1500);
}

// Also expose game state in /state endpoint (add players)
function quitGame(){
  if(tg) tg.close();
  else location.reload();
}
</script>
</body>
</html>
