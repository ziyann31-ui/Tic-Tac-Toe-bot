<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tic Tac Toe</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap');
  :root{--bg:#0a0a0f;--surface:#13131a;--border:#1e1e2e;--accent:#7c3aed;--accent2:#06b6d4;--x:#f472b6;--o:#34d399;--text:#e2e8f0;--muted:#64748b;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--text);font-family:'Space Mono',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:hidden;}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(124,58,237,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(124,58,237,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;}
  .waiting-screen{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:24px;text-align:center;}
  .wait-icon{font-size:64px;animation:float 3s ease-in-out infinite;}
  .wait-title{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .wait-sub{font-size:12px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
  .wait-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;width:100%;}
  .wait-card-title{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;}
  .wait-player{display:flex;align-items:center;gap:12px;padding:10px 0;}
  .wait-player+.wait-player{border-top:1px solid var(--border);}
  .wait-sym{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:18px;font-weight:800;}
  .wait-sym.x{background:rgba(244,114,182,.1);color:var(--x);}
  .wait-sym.o{background:rgba(52,211,153,.1);color:var(--o);}
  .wait-name{font-size:13px;font-weight:700;}
  .wait-name.muted{color:var(--muted);}
  .pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);margin-left:auto;animation:pulse 1.5s ease-in-out infinite;}
  .spinner-row{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;letter-spacing:1px;text-transform:uppercase;}
  .spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
  .game-screen{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:16px;}
  .header{text-align:center;}
  .title{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .round-info{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:4px;}
  .rounds-bar{display:flex;gap:8px;align-items:center;}
  .round-dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--border);transition:all .3s;}
  .round-dot.x{background:var(--x);border-color:var(--x);box-shadow:0 0 8px var(--x);}
  .round-dot.o{background:var(--o);border-color:var(--o);box-shadow:0 0 8px var(--o);}
  .round-dot.draw{background:var(--muted);border-color:var(--muted);}
  .round-sep{font-size:10px;color:var(--muted);}
  .players{display:flex;align-items:center;gap:12px;width:100%;}
  .player{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;transition:all .3s;position:relative;overflow:hidden;}
  .player.active{border-color:var(--accent);box-shadow:0 0 20px rgba(124,58,237,.2);}
  .player.active::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
  .player-sym{font-size:22px;font-weight:700;font-family:'Syne',sans-serif;}
  .player-x .player-sym{color:var(--x);}
  .player-o .player-sym{color:var(--o);}
  .player-name{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .player-score{font-size:18px;font-weight:700;margin-top:4px;}
  .vs{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px;}
  .status{font-size:13px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;height:20px;text-align:center;}
  .status.your-turn{color:var(--accent2);}
  .status.win{color:var(--o);}
  .status.lose{color:var(--x);}
  .status.draw{color:var(--accent);}
  .board-wrap{position:relative;}
  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:20px;}
  .cell{width:88px;height:88px;background:var(--bg);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;font-family:'Syne',sans-serif;font-size:36px;font-weight:800;user-select:none;}
  .cell:hover:not(.taken):not(.disabled){border-color:var(--accent);background:rgba(124,58,237,.05);transform:scale(1.02);}
  .cell.x{color:var(--x);animation:popIn .2s ease;}
  .cell.o{color:var(--o);animation:popIn .2s ease;}
  .cell.win-cell{border-color:var(--accent);background:rgba(124,58,237,.1);box-shadow:0 0 15px rgba(124,58,237,.4);}
  .cell.disabled{cursor:not-allowed;opacity:.7;}
  .result-overlay{display:none;position:absolute;inset:0;background:rgba(10,10,15,.92);border-radius:20px;align-items:center;justify-content:center;flex-direction:column;gap:8px;backdrop-filter:blur(6px);}
  .result-overlay.show{display:flex;}
  .result-emoji{font-size:48px;}
  .result-text{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;text-align:center;}
  .result-sub{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
  .btn-row{display:flex;gap:10px;width:100%;}
  .btn{flex:1;padding:13px;border-radius:12px;border:none;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s;}
  .btn-primary{background:linear-gradient(135deg,var(--accent),#5b21b6);color:white;}
  .btn-secondary{background:var(--surface);color:var(--muted);border:1px solid var(--border);}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes popIn{0%{transform:scale(0)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
</style>
</head>
<body>

<div class="waiting-screen" id="waitingScreen">
  <div class="wait-icon">⚔️</div>
  <div>
    <div class="wait-title">Tic Tac Toe</div>
    <div class="wait-sub" id="waitSub">Waiting for opponent...</div>
  </div>
  <div class="wait-card">
    <div class="wait-card-title">Players</div>
    <div class="wait-player">
      <div class="wait-sym x">X</div>
      <div class="wait-name" id="wnameX">Player X</div>
      <div class="pulse-dot" style="background:var(--o)"></div>
    </div>
    <div class="wait-player">
      <div class="wait-sym o">O</div>
      <div class="wait-name muted" id="wnameO">Waiting...</div>
      <div class="pulse-dot"></div>
    </div>
  </div>
  <div class="spinner-row" id="spinnerRow">
    <div class="spinner"></div>
    <span>Waiting for opponent to join</span>
  </div>
</div>

<div class="game-screen" id="gameScreen" style="display:none">
  <div class="header">
    <div class="title">Tic Tac Toe</div>
    <div class="round-info" id="roundInfo">Round 1 of 3</div>
  </div>
  <div class="rounds-bar">
    <div class="round-dot" id="rd0"></div>
    <div class="round-sep">·</div>
    <div class="round-dot" id="rd1"></div>
    <div class="round-sep">·</div>
    <div class="round-dot" id="rd2"></div>
  </div>
  <div class="players">
    <div class="player player-x" id="playerX">
      <div class="player-sym">X</div>
      <div class="player-name" id="nameX">Player X</div>
      <div class="player-score" id="scoreX">0</div>
    </div>
    <div class="vs">VS</div>
    <div class="player player-o" id="playerO">
      <div class="player-sym">O</div>
      <div class="player-name" id="nameO">Player O</div>
      <div class="player-score" id="scoreO">0</div>
    </div>
  </div>
  <div class="status" id="status">Loading...</div>
  <div class="board-wrap">
    <div class="board" id="board">
      <div class="cell" onclick="move(0)"></div>
      <div class="cell" onclick="move(1)"></div>
      <div class="cell" onclick="move(2)"></div>
      <div class="cell" onclick="move(3)"></div>
      <div class="cell" onclick="move(4)"></div>
      <div class="cell" onclick="move(5)"></div>
      <div class="cell" onclick="move(6)"></div>
      <div class="cell" onclick="move(7)"></div>
      <div class="cell" onclick="move(8)"></div>
    </div>
    <div class="result-overlay" id="resultOverlay">
      <div class="result-emoji" id="resultEmoji">🏆</div>
      <div class="result-text" id="resultText">You Win!</div>
      <div class="result-sub" id="resultSub">Well played</div>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-secondary" onclick="quitGame()">Quit</button>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}

const API = 'https://web-production-a0396.up.railway.app';
const tgStart = tg?.initDataUnsafe?.start_param || '';
let gameId, playerId, mySymbol='X';

if(tgStart && tgStart.includes('_')){
  const p = tgStart.split('_');
  gameId   = p[0];
  playerId = String(tg?.initDataUnsafe?.user?.id || '0');
} else {
  const params = new URLSearchParams(window.location.search);
  gameId   = window._GAME_ID || params.get('game_id');
  playerId = window._PLAYER_ID || params.get('player_id') || String(tg?.initDataUnsafe?.user?.id||'0');
}

// Game state
let board    = Array(9).fill(null);
let current  = 'X';
let rounds   = {X:0, O:0};
let round    = 1;
let gameOver = false;
let names    = {X:'Player X', O:'Player O'};
let movePending = false;
let pollTimer   = null;

const WIN_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

// ---- INIT ----
async function init(){
  if(!gameId || !playerId || playerId==='0'){ startPollWaiting(); return; }
  try{
    const name = encodeURIComponent(tg?.initDataUnsafe?.user?.first_name || 'Player');
    const r    = await fetch(`${API}/join?game_id=${gameId}&pid=${playerId}&name=${name}`);
    const d    = await r.json();
    if(d.error === 'start_required'){
      const botLink = d.bot_link || 'https://t.me/XO_VerseBot';
      document.getElementById('waitSub').innerHTML = 
        `Please <a href="${botLink}" style="color:var(--accent2)">start @XO_VerseBot</a> first to play!`;
      document.getElementById('spinnerRow').style.display = 'none';
      // Show button to open bot
      const btn = document.createElement('a');
      btn.href = botLink;
      btn.target = '_blank';
      btn.style = 'background:linear-gradient(135deg,var(--accent),#5b21b6);color:white;padding:14px 28px;border-radius:12px;font-family:Space Mono,monospace;font-size:12px;font-weight:700;letter-spacing:1px;text-decoration:none;text-transform:uppercase;';
      btn.textContent = '▶ Start Bot';
      document.getElementById('waitingScreen').appendChild(btn);
      return;
    }
    if(d.error === 'expired'){
      document.getElementById('waitSub').textContent = 'Game expired.';
      document.getElementById('spinnerRow').style.display = 'none';
      return;
    }
    if(d.ok){
      mySymbol = d.symbol;
      if(d.rounds) rounds = d.rounds;
      if(d.status === 'playing'){
        const sr = await fetch(`${API}/state?game_id=${gameId}&pid=${playerId}`);
        const sd = await sr.json();
        applyState(sd);
        showGame();
      } else {
        startPollWaiting();
      }
    }
  } catch(e){ console.error(e); startPollWaiting(); }
}

init();

// ---- APPLY SERVER STATE ----
function applyState(d){
  if(!d || d.error) return;
  if(d.board)   board   = d.board;
  if(d.current) current = d.current;
  if(d.rounds)  rounds  = d.rounds;
  if(d.round)   round   = d.round;
  if(d.players){
    names.X = d.players.X?.name || 'Player X';
    names.O = d.players.O?.name || 'Player O';
  }
  if(d.my_symbol) mySymbol = d.my_symbol;
}

// ---- SHOW GAME ----
function showGame(){
  document.getElementById('waitingScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display    = 'flex';
  document.getElementById('nameX').textContent = names.X;
  document.getElementById('nameO').textContent = names.O;
  renderAll();
  // Start polling if not my turn
  if(current !== mySymbol) startPoll();
}

// ---- MOVE ----
async function move(i){
  if(gameOver || movePending) return;
  if(board[i] !== null) return;
  if(current !== mySymbol) return;

  movePending = true;
  board[i]    = mySymbol;
  renderBoard();
  disableBoard();

  try{
    const r = await fetch(`${API}/move`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({game_id:gameId, player_id:playerId, cell:i})
    });
    const d = await r.json();

    if(d.error){
      // Revert move
      board[i] = null;
      movePending = false;
      renderAll();
      return;
    }

    board   = d.board;
    current = d.current;
    if(d.rounds) rounds = d.rounds;
    if(d.round)  round  = d.round;

    if(d.round_winner){
      handleRoundResult(d.round_winner, d.game_winner);
    } else {
      movePending = false;
      renderAll();
      // Now opponent's turn — start polling
      startPoll();
    }
  } catch(e){
    console.error(e);
    board[i] = null;
    movePending = false;
    renderAll();
  }
}

// ---- ROUND RESULT ----
function handleRoundResult(roundWinner, gameWinner){
  movePending = false;

  // Update scores display
  document.getElementById('scoreX').textContent = rounds.X;
  document.getElementById('scoreO').textContent = rounds.O;
  updateRoundDots();

  if(gameWinner){
    gameOver = true;
    renderBoard();
    if(gameWinner === mySymbol){
      showOverlay('🏆', 'You Win!', 'Champion! 🎉');
    } else {
      showOverlay('😔', 'You Lose', 'Better luck next time');
    }
    return;
  }

  // Round over — show result briefly then next round
  if(roundWinner === 'draw'){
    showOverlay('🤝', "Round Draw!", `Round ${round} of 3`);
  } else if(roundWinner === mySymbol){
    showOverlay('✅', 'Round Won!', `Round ${round} of 3`);
  } else {
    showOverlay('❌', 'Round Lost!', `Round ${round} of 3`);
  }

  setTimeout(()=>{
    hideOverlay();
    renderAll();
    // If my turn next, enable board
    if(current === mySymbol){
      enableBoard();
    } else {
      disableBoard();
      startPoll();
    }
  }, 2000);
}

// ---- POLLING ----
function startPoll(){
  clearTimeout(pollTimer);
  pollTimer = setTimeout(doPoll, 1500);
}

async function doPoll(){
  if(gameOver) return;
  try{
    const r = await fetch(`${API}/state?game_id=${gameId}&pid=${playerId}`);
    const d = await r.json();

    if(!d || d.error){ startPoll(); return; }

    // Opponent quit
    if(d.status === 'finished' && d.quit_by && String(d.quit_by) !== String(playerId)){
      gameOver = true;
      showOverlay('🏆', 'Opponent Quit!', 'You Win!');
      return;
    }

    // Check if state changed
    const stateChanged = JSON.stringify(d.board) !== JSON.stringify(board) ||
                         d.current !== current ||
                         JSON.stringify(d.rounds) !== JSON.stringify(rounds);

    if(stateChanged){
      applyState(d);
      if(d.round_winner){
        handleRoundResult(d.round_winner, d.game_winner);
        return;
      }
      renderAll();
    }

    // Continue polling if not my turn
    if(current !== mySymbol && !gameOver){
      startPoll();
    } else if(current === mySymbol){
      movePending = false;
      enableBoard();
    }
  } catch(e){
    console.error(e);
    startPoll();
  }
}

// ---- WAITING POLL ----
let waitTimer = null;
function startPollWaiting(){
  clearTimeout(waitTimer);
  waitTimer = setTimeout(doPollWaiting, 1500);
}

async function doPollWaiting(){
  try{
    const r = await fetch(`${API}/state?game_id=${gameId}&pid=${playerId}`);
    const d = await r.json();

    if(d.status === 'expired'){
      document.getElementById('waitSub').textContent = 'Game expired. No one joined.';
      document.getElementById('spinnerRow').style.display = 'none';
      return;
    }

    if(d.players){
      document.getElementById('wnameX').textContent = d.players.X?.name || 'Player X';
      document.getElementById('wnameO').textContent = d.players.O?.name || 'Waiting...';
    }

    if(d.status === 'playing' && d.players?.X && d.players?.O){
      applyState(d);
      showGame();
      return;
    }

    startPollWaiting();
  } catch(e){
    console.error(e);
    startPollWaiting();
  }
}

// ---- RENDER ----
function renderAll(){
  renderBoard();
  updateStatus();
  updateRoundDots();
  document.getElementById('scoreX').textContent = rounds.X;
  document.getElementById('scoreO').textContent = rounds.O;
  document.getElementById('roundInfo').textContent = `Round ${round} of 3`;
}

function renderBoard(){
  document.querySelectorAll('.cell').forEach((cell, i)=>{
    const val = board[i];
    cell.textContent  = val || '';
    cell.className    = `cell${val ? ' '+val.toLowerCase()+' taken' : ''}`;
    if(gameOver || current !== mySymbol || movePending) cell.classList.add('disabled');
  });
}

function enableBoard(){
  document.querySelectorAll('.cell').forEach(c => c.classList.remove('disabled'));
  updateStatus();
}

function disableBoard(){
  document.querySelectorAll('.cell').forEach(c => c.classList.add('disabled'));
}

function updateStatus(){
  const myTurn = current === mySymbol && !gameOver;
  const s = document.getElementById('status');
  s.textContent = myTurn ? 'Your Turn' : "Opponent's Turn";
  s.className   = `status ${myTurn ? 'your-turn' : 'waiting'}`;
  document.getElementById('playerX').classList.toggle('active', current==='X');
  document.getElementById('playerO').classList.toggle('active', current==='O');
}

function updateRoundDots(){
  const dots = ['rd0','rd1','rd2'].map(id => document.getElementById(id));
  dots.forEach(d => d.className = 'round-dot');
  let idx = 0;
  for(let i=0; i<rounds.X; i++) if(dots[idx]) { dots[idx].className='round-dot x'; idx++; }
  for(let i=0; i<rounds.O; i++) if(dots[idx]) { dots[idx].className='round-dot o'; idx++; }
}

function showOverlay(emoji, text, sub){
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultText').textContent  = text;
  document.getElementById('resultSub').textContent   = sub;
  document.getElementById('resultOverlay').classList.add('show');
}

function hideOverlay(){
  document.getElementById('resultOverlay').classList.remove('show');
}

async function quitGame(){
  if(API && gameId && playerId){
    try{ await fetch(`${API}/quit?game_id=${gameId}&pid=${playerId}`); } catch(e){}
  }
  if(tg) tg.close();
  else location.reload();
}
</script>
</body>
</html>
