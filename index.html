<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tic Tac Toe</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .status {
            font-size: 1.1rem;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        .players {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 10px;
        }
        .player-card {
            flex: 1;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        .player-card.active {
            border-color: #00d4ff;
            background: rgba(0,212,255,0.1);
        }
        .player-card.winner {
            border-color: #ffd700;
            background: rgba(255,215,0,0.15);
        }
        .player-symbol {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .player-name {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-top: 4px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 20px 0;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
        }
        .cell {
            aspect-ratio: 1;
            background: rgba(255,255,255,0.08);
            border: none;
            border-radius: 12px;
            font-size: 2.5rem;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cell:hover:not(.taken) {
            background: rgba(255,255,255,0.15);
            transform: scale(1.05);
        }
        .cell.taken {
            cursor: not-allowed;
        }
        .cell.x {
            color: #00d4ff;
        }
        .cell.o {
            color: #ff6b6b;
        }
        .cell.win {
            animation: pulse 0.5s ease infinite alternate;
            background: rgba(255,215,0,0.2);
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
        .btn {
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 5px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #7b2cbf);
            color: #fff;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,212,255,0.3);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
        }
        .hidden {
            display: none !important;
        }
        .waiting-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .result-overlay.show {
            display: flex;
        }
        .result-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }
        .result-text {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 25px;
        }
        .join-info {
            background: rgba(0,212,255,0.1);
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="waiting-overlay" id="waitingOverlay">
        <div class="spinner"></div>
        <p id="waitingText">Waiting for opponent to join...</p>
        <div class="join-info" id="joinInfo">
            <p>👤 <strong>Player X:</strong> <span id="hostName">Host</span></p>
            <p style="margin-top: 8px; opacity: 0.8;">Share this chat so someone can click Join!</p>
        </div>
    </div>

    <div class="result-overlay" id="resultOverlay">
        <div class="result-icon" id="resultIcon">🏆</div>
        <div class="result-text" id="resultText">You Win!</div>
        <button class="btn btn-primary" onclick="closeGame()">Close</button>
    </div>

    <div class="container" id="gameContainer">
        <h1>🎮 Tic Tac Toe</h1>
        <div class="status" id="status">Your turn!</div>

        <div class="players">
            <div class="player-card active" id="playerX">
                <div class="player-symbol">❌</div>
                <div class="player-name" id="nameX">Player X</div>
            </div>
            <div class="player-card" id="playerO">
                <div class="player-symbol">⭕</div>
                <div class="player-name" id="nameO">Waiting...</div>
            </div>
        </div>

        <div class="board" id="board">
            <button class="cell" data-index="0" onclick="makeMove(0)"></button>
            <button class="cell" data-index="1" onclick="makeMove(1)"></button>
            <button class="cell" data-index="2" onclick="makeMove(2)"></button>
            <button class="cell" data-index="3" onclick="makeMove(3)"></button>
            <button class="cell" data-index="4" onclick="makeMove(4)"></button>
            <button class="cell" data-index="5" onclick="makeMove(5)"></button>
            <button class="cell" data-index="6" onclick="makeMove(6)"></button>
            <button class="cell" data-index="7" onclick="makeMove(7)"></button>
            <button class="cell" data-index="8" onclick="makeMove(8)"></button>
        </div>

        <div>
            <button class="btn btn-secondary" onclick="resetGame()">🔄 New Game</button>
            <button class="btn btn-primary" onclick="closeGame()">✅ Done</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Parse URL params
        const params = new URLSearchParams(window.location.search);
        const gameId = params.get('game') || 'solo_' + Date.now();
        const player1Id = params.get('player1');
        const name1 = params.get('name1') || 'Player X';
        const mode = params.get('mode') || 'multi';

        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let mySymbol = 'X';
        let gameActive = true;
        let player2Joined = false;
        let player2Name = 'Waiting...';
        let myId = tg.initDataUnsafe?.user?.id;
        let myName = tg.initDataUnsafe?.user?.first_name || 'You';
        let p1Moves = 0;
        let p2Moves = 0;

        // Initialize
        document.getElementById('nameX').textContent = name1;
        document.getElementById('hostName').textContent = name1;

        // Determine if I'm Player 1 (host) or Player 2 (joiner)
        if (player1Id && myId && myId.toString() === player1Id.toString()) {
            // I am the host (Player 1) - RESERVED
            mySymbol = 'X';
            document.getElementById('waitingText').textContent = 'Waiting for opponent to click Join...';
            document.getElementById('waitingOverlay').classList.remove('hidden');

            // Poll for opponent
            startPollingForOpponent();
        } else {
            // I am joining as Player 2
            mySymbol = 'O';
            player2Joined = true;
            player2Name = myName;
            document.getElementById('nameO').textContent = myName;
            document.getElementById('waitingOverlay').classList.add('hidden');

            // Notify bot that I joined
            sendData({
                action: 'join', 
                game_id: gameId, 
                player2: myId, 
                name2: myName
            });
        }

        // Polling for opponent (for host)
        function startPollingForOpponent() {
            const pollInterval = setInterval(() => {
                if (player2Joined) {
                    clearInterval(pollInterval);
                    return;
                }
            }, 2000);

            // Auto-hide waiting after some time if playing solo
            if (mode === 'solo') {
                setTimeout(() => {
                    player2Joined = true;
                    player2Name = 'Bot';
                    document.getElementById('nameO').textContent = 'Bot';
                    document.getElementById('waitingOverlay').classList.add('hidden');
                }, 1000);
            }
        }

        function makeMove(index) {
            if (!gameActive || board[index] !== '') return;
            if (!player2Joined && mode !== 'solo') {
                tg.showAlert('Waiting for opponent to join...');
                return;
            }

            // Only allow if it's my turn
            if (currentPlayer !== mySymbol) {
                tg.showAlert("It's not your turn!");
                return;
            }

            board[index] = currentPlayer;
            updateCell(index, currentPlayer);

            // Track moves
            if (currentPlayer === 'X') p1Moves++;
            else p2Moves++;

            const winner = checkWinner();
            if (winner) {
                gameActive = false;
                highlightWin(winner.line);
                showResult(winner.winner);
                sendData({
                    action: 'game_over', 
                    game_id: gameId, 
                    winner: winner.winner,
                    p1_moves: p1Moves,
                    p2_moves: p2Moves
                });
                return;
            }

            if (board.every(cell => cell !== '')) {
                gameActive = false;
                showResult('draw');
                sendData({
                    action: 'game_over', 
                    game_id: gameId, 
                    winner: 'draw',
                    p1_moves: p1Moves,
                    p2_moves: p2Moves
                });
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            updateStatus();

            // Bot move in solo mode
            if (mode === 'solo' && currentPlayer === 'O') {
                setTimeout(botMove, 600);
            }
        }

        function botMove() {
            if (!gameActive) return;
            const move = getBestMove();
            board[move] = 'O';
            updateCell(move, 'O');
            p2Moves++;

            const winner = checkWinner();
            if (winner) {
                gameActive = false;
                highlightWin(winner.line);
                showResult(winner.winner);
                return;
            }

            if (board.every(cell => cell !== '')) {
                gameActive = false;
                showResult('draw');
                return;
            }

            currentPlayer = 'X';
            updateStatus();
        }

        function getBestMove() {
            // Try to win
            for (let i = 0; i < 9; i++) {
                if (board[i] === '') {
                    board[i] = 'O';
                    if (checkWinner()?.winner === 'O') {
                        board[i] = '';
                        return i;
                    }
                    board[i] = '';
                }
            }
            // Block opponent
            for (let i = 0; i < 9; i++) {
                if (board[i] === '') {
                    board[i] = 'X';
                    if (checkWinner()?.winner === 'X') {
                        board[i] = '';
                        return i;
                    }
                    board[i] = '';
                }
            }
            // Take center
            if (board[4] === '') return 4;
            // Take corners
            const corners = [0, 2, 6, 8].filter(i => board[i] === '');
            if (corners.length) return corners[Math.floor(Math.random() * corners.length)];
            // Take any available
            const available = board.map((v, i) => v === '' ? i : null).filter(v => v !== null);
            return available[Math.floor(Math.random() * available.length)];
        }

        function updateCell(index, player) {
            const cell = document.querySelector(`[data-index="${index}"]`);
            cell.textContent = player === 'X' ? '❌' : '⭕';
            cell.classList.add('taken', player.toLowerCase());
        }

        function updateStatus() {
            const statusEl = document.getElementById('status');
            const isMyTurn = currentPlayer === mySymbol;

            if (!player2Joined && mode !== 'solo') {
                statusEl.textContent = "Waiting for opponent...";
            } else {
                statusEl.textContent = isMyTurn ? "Your turn!" : "Opponent's turn...";
            }

            document.getElementById('playerX').classList.toggle('active', currentPlayer === 'X');
            document.getElementById('playerO').classList.toggle('active', currentPlayer === 'O');
        }

        function checkWinner() {
            const lines = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];
            for (const line of lines) {
                const [a, b, c] = line;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return {winner: board[a], line};
                }
            }
            if (board.every(cell => cell !== '')) {
                return {winner: 'draw', line: null};
            }
            return null;
        }

        function highlightWin(line) {
            if (!line) return;
            for (const idx of line) {
                document.querySelector(`[data-index="${idx}"]`).classList.add('win');
            }
        }

        function showResult(result) {
            const overlay = document.getElementById('resultOverlay');
            const icon = document.getElementById('resultIcon');
            const text = document.getElementById('resultText');

            if (result === 'draw') {
                icon.textContent = '🤝';
                text.textContent = "It's a draw! Well played.";
            } else if (result === mySymbol) {
                icon.textContent = '🏆';
                text.textContent = 'You Win! Congratulations!';
            } else {
                icon.textContent = '😔';
                text.textContent = 'You Lose! Better luck next time.';
            }

            overlay.classList.add('show');
        }

        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = 'X';
            gameActive = true;
            p1Moves = 0;
            p2Moves = 0;

            document.querySelectorAll('.cell').forEach(cell => {
                cell.textContent = '';
                cell.className = 'cell';
            });

            document.getElementById('resultOverlay').classList.remove('show');
            updateStatus();

            if (mode === 'solo' && mySymbol === 'O') {
                setTimeout(botMove, 600);
            }
        }

        function closeGame() {
            tg.close();
        }

        function sendData(data) {
            if (tg.sendData) {
                tg.sendData(JSON.stringify(data));
            }
        }

        // Initialize status
        updateStatus();
    </script>
</body>
</html>
